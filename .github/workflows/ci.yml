# CI on every push and pull request (ADR-0005's "CI shape").
#
# - windows: the full `mvn verify` (unit, Jolt, gl and smoke tests) on a pinned Mesa, which gives the runner
#   a real OpenGL 4.6 core driver in place of GDI Generic's GL 1.1.
# - ubuntu: compile plus every test except the gl-tagged ones, which keeps the build Linux-capable (ADR-0004).
#   The no-gl profile excludes them by tag; a gl test never skips itself (ADR-0005).
#
# Third-party actions are pinned to commit SHAs; the comment beside each names the release it is.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '27'
  JAVA_DISTRIBUTION: temurin
  # Keeps Maven's log readable in the Actions UI.
  MAVEN_ARGS: --batch-mode --no-transfer-progress --errors

jobs:
  windows:
    name: Windows (mvn verify, Mesa GL)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Mesa as a system-wide OpenGL driver (ADR-0005), from pal1000/mesa-dist-win.
      #   version 26.2.4 (released 2026-10-04): the newest mesa-dist-win release when CI was set up. It is
      #     pinned, not "latest", so a Mesa update can't change GL behaviour under an unchanged commit; bump
      #     it deliberately and watch the gl tests.
      #   build-type release-msvc: the MSVC release build, the action's default flavour.
      #   deployment-choice 1: "Core desktop OpenGL drivers". It copies Mesa's WGL driver (llvmpipe) into
      #     System32 as mesadrv.dll and registers it as the OpenGL ICD, so Windows' own opengl32.dll loads it
      #     and the renderer takes the same native WGL path as on a real machine.
      - uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0
        with:
          version: '26.2.4'
          build-type: release-msvc
          deployment-choice: '1'

      - name: mvn verify
        run: ./mvnw.cmd verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-windows
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  ubuntu:
    name: Ubuntu (compile and non-GL tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # There is no GL driver here, so the gl-tagged tests are left out by tag (the no-gl profile). Render's
      # GlTagGuardTest fails the job if that exclusion ever stops working.
      - name: mvn verify, excluding gl-tagged tests
        run: ./mvnw verify -Pno-gl

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-ubuntu
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
